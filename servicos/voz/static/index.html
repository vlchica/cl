<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Assistente de voz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%236c8cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="ponto" id="ponto-conexao" title="Conexão"></span>
      <span>Assistente de voz</span>
    </div>
    <nav class="acoes-topo">
      <a id="link-webui" class="botao-texto" href="#" target="_blank" rel="noopener" hidden>Abrir Open WebUI</a>
      <button class="botao-icone" id="botao-config" aria-label="Configurações" title="Configurações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.94-2.06.06-1.44-.06-1.44-2.03-.4a7.03 7.03 0 0 0-.6-1.45l1.15-1.72-2-2-1.72 1.15c-.46-.25-.94-.45-1.45-.6l-.4-2.03h-2.88l-.4 2.03c-.51.15-.99.35-1.45.6L5.44 5.48l-2 2 1.15 1.72c-.25.46-.45.94-.6 1.45l-2.03.4L1.9 12l.06 1.44 2.03.4c.15.51.35.99.6 1.45l-1.15 1.72 2 2 1.72-1.15c.46.25.94.45 1.45.6l.4 2.03h2.88l.4-2.03c.51-.15.99-.35 1.45-.6l1.72 1.15 2-2-1.15-1.72c.25-.46.45-.94.6-1.45l2.03-.4Z"/></svg>
      </button>
    </nav>
  </header>

  <main class="palco">
    <section class="centro" aria-live="polite">
      <button class="orbe" id="orbe" aria-label="Começar conversa" data-estado="parado">
        <span class="anel"></span>
        <span class="nucleo"></span>
      </button>
      <p class="estado" id="estado">Toque para começar</p>
      <p class="detalhe" id="detalhe">O microfone fica aberto: é só falar. Para interromper, fale por cima.</p>
      <div class="fila" id="fila" hidden></div>
      <div class="controles" id="controles" hidden>
        <button class="botao-redondo" id="botao-mudo" aria-pressed="false" title="Silenciar microfone">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="mic" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/><path class="risco" d="M3 3l18 18" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span>Microfone</span>
        </button>
        <button class="botao-redondo perigo" id="botao-parar" title="Parar tudo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          <span>Parar</span>
        </button>
        <button class="botao-redondo" id="botao-anexo" title="Enviar arquivo para eu ler">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5v10.25a4.5 4.5 0 0 1-9 0V5.75a3 3 0 0 1 6 0v10.5a1.5 1.5 0 0 1-3 0V6.5H9v9.75a3 3 0 0 0 6 0V5.75a4.5 4.5 0 0 0-9 0v11a6 6 0 0 0 12 0V6.5h-1.5Z"/></svg>
          <span>Arquivo</span>
        </button>
        <button class="botao-redondo" id="botao-nova" title="Nova conversa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z"/></svg>
          <span>Nova</span>
        </button>
        <input type="file" id="entrada-arquivo" accept=".pdf,.docx,.txt,.md,.csv,.json,.html,.htm" hidden>
      </div>
    </section>

    <section class="conversa" id="conversa" aria-label="Transcrição da conversa"></section>

    <form class="digitar" id="form-texto" autocomplete="off">
      <input id="campo-texto" type="text" placeholder="Ou digite aqui…" aria-label="Mensagem">
      <button type="submit" aria-label="Enviar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.39 10.1 15 12 3.39 13.9Z"/></svg>
      </button>
    </form>
  </main>

  <dialog id="dialogo-config">
    <form method="dialog" class="config">
      <h2>Configurações</h2>
      <label>Voz
        <select id="cfg-voz">
          <option value="pf_dora">Dora (feminina)</option>
          <option value="pm_alex">Alex (masculina)</option>
          <option value="pm_santa">Santa (masculina)</option>
          <option value="pt_BR-faber-medium">Faber (Piper, reserva)</option>
        </select>
      </label>
      <label>Velocidade da fala <output id="cfg-velocidade-valor">1.0×</output>
        <input id="cfg-velocidade" type="range" min="0.8" max="1.4" step="0.05" value="1">
      </label>
      <label>Tempo de silêncio para encerrar sua fala <output id="cfg-silencio-valor">0.7 s</output>
        <input id="cfg-silencio" type="range" min="0.3" max="2" step="0.1" value="0.7">
      </label>
      <label class="linha"><input id="cfg-fone" type="checkbox"> Estou de fone de ouvido (interrupção mais sensível)</label>
      <label class="linha"><input id="cfg-transcricao" type="checkbox" checked> Mostrar transcrição</label>
      <menu><button value="ok" class="botao-primario">Fechar</button></menu>
    </form>
  </dialog>

  <script src="/static/vad/ort.wasm.min.js"></script>
  <script src="/static/vad/bundle.min.js"></script>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
